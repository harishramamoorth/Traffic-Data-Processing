<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Data Processor | Privacy & Pipeline Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Ultra-lightweight pre-hydration loading animation */
      #preloader-container {
        position: fixed;
        inset: 0;
        background: #070b14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
        user-select: none;
      }
      .preloader-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
        border-radius: 50%;
        filter: blur(40px);
        pointer-events: none;
      }
      .preloader-radar {
        position: relative;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .radar-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(6, 182, 212, 0.2);
      }
      .radar-ring-1 {
        inset: 0;
        border-top-color: #06b6d4;
        border-right-color: #3b82f6;
        animation: preloader-spin 1.8s linear infinite;
      }
      .radar-ring-2 {
        inset: 12px;
        border-bottom-color: #10b981;
        animation: preloader-spin 2.6s linear infinite reverse;
      }
      .radar-pulse {
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        border: 1px solid rgba(6, 182, 212, 0.4);
        animation: preloader-pulse 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .preloader-core {
        position: relative;
        width: 52px;
        height: 52px;
        background: linear-gradient(135deg, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.1));
        border: 1px solid rgba(6, 182, 212, 0.4);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px rgba(6, 182, 212, 0.35);
      }
      .preloader-core svg {
        width: 26px;
        height: 26px;
        stroke: #38bdf8;
      }
      .preloader-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preloader-title span {
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .preloader-subtitle {
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        color: #94a3b8;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 20px;
      }
      .preloader-track {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-beam {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 60%;
        background: linear-gradient(90deg, transparent, #06b6d4, #10b981, transparent);
        border-radius: 999px;
        animation: preloader-shimmer 1.6s ease-in-out infinite;
      }
      .preloader-status {
        margin-top: 12px;
        font-size: 10px;
        font-family: 'JetBrains Mono', monospace;
        color: #64748b;
        letter-spacing: 0.1em;
      }
      @keyframes preloader-spin {
        100% { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0% { transform: scale(0.6); opacity: 0.8; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      @keyframes preloader-shimmer {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Pre-Hydration Preloader (Removed automatically by React) -->
      <div id="preloader-container">
        <div class="preloader-glow"></div>
        <div class="preloader-radar">
          <div class="radar-pulse"></div>
          <div class="radar-ring radar-ring-1"></div>
          <div class="radar-ring radar-ring-2"></div>
          <div class="preloader-core">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="m9 12 2 2 4-4"/>
            </svg>
          </div>
        </div>
        <div class="preloader-title">Traffic<span>Processor</span></div>
        <div class="preloader-subtitle">Data Privacy &amp; Telemetry Engine</div>
        <div class="preloader-track">
          <div class="preloader-beam"></div>
        </div>
        <div class="preloader-status">INITIALIZING PRIVACY PIPELINE...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
